name: publish-acp-ui-package

on:
  workflow_dispatch:
  push:
    tags:
      - acp-ui-v*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install root dependencies
        run: npm ci

      - name: Derive ACP UI release semver from tag
        id: version
        run: |
          ACP_UI_VERSION="$(node ./scripts/acp-ui-release-version.mjs --tag "${GITHUB_REF_NAME}" --print-only)"
          echo "ACP_UI_VERSION=${ACP_UI_VERSION}" >> "$GITHUB_ENV"
          echo "acp_ui_version=${ACP_UI_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync package version to release tag
        run: |
          node ./scripts/acp-ui-release-version.mjs --tag "${GITHUB_REF_NAME}" --package packages/acp-ui/package.json

      - name: Verify synced ACP UI package version
        run: |
          PACKAGE_VERSION="$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('packages/acp-ui/package.json','utf8')); process.stdout.write(pkg.version)")"
          test "$PACKAGE_VERSION" = "$ACP_UI_VERSION"

      - name: Build ACP UI package
        working-directory: packages/acp-ui
        run: npm run build

      - name: Publish @strato-space/acp-ui
        working-directory: packages/acp-ui
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
